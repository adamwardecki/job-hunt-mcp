name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm run setup
      - run: npm --prefix dev exec --no -- biome ci .

  test:
    # 22.18 is the floor in package.json engines; keep it in the matrix so nothing newer sneaks in.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18', 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - run: npm run setup
      # Typecheck, Node tests (Chrome and pwsh suites run where the runner has them), Python Hermes tests.
      - run: npm test
