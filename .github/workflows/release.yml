name: Release

# A version bump on main (it always changes server.json) releases the tracker MCP server: a GitHub release with
# the MCPB bundle, then the MCP Registry entry. Each step is skipped when already done, so a failed run can be
# re-run from the Actions tab (or with workflow_dispatch) without duplicating anything.

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # mcp-publisher login github-oidc
    env:
      GH_TOKEN: ${{ github.token }}
      SERVER_NAME: io.github.adamwardecki/job-tracker
      # Pinned with its checksum from registry_1.8.1_checksums.txt. Bump both together; an "invalid audience"
      # error from login means the registry needs a newer publisher.
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: What needs doing
        id: state
        run: |
          version=$(node -p "require('./server.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then released=true; else released=false; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME//\//%2F}/versions/$version")
          if [ "$status" = 200 ]; then listed=true; elif [ "$status" = 404 ]; then listed=false; else echo "registry returned $status" >&2; exit 1; fi
          echo "listed=$listed" >> "$GITHUB_OUTPUT"
          echo "v$version: released=$released, listed=$listed"

      - name: Test
        if: steps.state.outputs.released == 'false' || steps.state.outputs.listed == 'false'
        run: |
          npm run setup
          npm test

      # The bundle is reproducible, so this rebuilds the exact bytes whose hash is committed in server.json.
      - name: Build the bundle
        if: steps.state.outputs.released == 'false'
        run: node --no-warnings registry/pack.ts --check

      - name: Create the GitHub release
        if: steps.state.outputs.released == 'false'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          sha=$(node -p "require('./server.json').packages[0].fileSha256")
          gh release create "v$VERSION" "dist/job-tracker-$VERSION.mcpb" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "The tracker MCP server as an MCPB bundle, listed in the MCP Registry as \`$SERVER_NAME\`. Needs Node 22.18 or newer; Claude Desktop runs it on its built-in Node. SHA-256: \`$sha\`"

      - name: Check the release asset
        if: steps.state.outputs.listed == 'false'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          url=$(node -p "require('./server.json').packages[0].identifier")
          want=$(node -p "require('./server.json').packages[0].fileSha256")
          got=$(curl -sfL "$url" | sha256sum | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then echo "$url has sha256 $got, server.json says $want" >&2; exit 1; fi

      - name: Publish to the MCP Registry
        if: steps.state.outputs.listed == 'false'
        run: |
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
